[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-grpo"
version = "0.1.0"
description = "Bidirectional Zh-En translation GRPO with hybrid MQM/Pairwise judge, 7-dim reward, reference anchor advantage, and hard masking."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.1",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "datasets>=2.18.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["translation_grpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
