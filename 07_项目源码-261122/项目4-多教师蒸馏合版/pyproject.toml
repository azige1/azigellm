[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-teacher-distillation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "verl[vllm]==0.9.1",
  "vllm==0.24.0",
  "torch==2.11",
  "transformers==5.9.0",
  "fastapi",
  "uvicorn",
  "httpx",
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic",
  "sympy",
  "docker",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["multi_teacher_distillation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
