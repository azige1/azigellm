# Reference-only cluster scale configuration (24 x H800 total):
# - Policy training & rollout: 16 x H800 (2 nodes x 8 GPUs), 14B distilled reasoning model, full-parameter DAPO
# - Standalone judge server: 8 x H800 (TP=8) serving Qwen/Qwen3-235B-A22B via vLLM OpenAI-compatible API
# - Stage 1: 500 steps @ 8K (loss_scale_factor: 8192); Stage 2: 400 steps @ 16K (total 900 steps, loss_scale_factor: 16384)

data:
  train_files: data/processed/train_186k.parquet
  val_files: data/processed/val_k12_600.parquet
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 8192
  train_batch_size: 128
  gen_batch_size: 1
  val_batch_size: 256
  return_raw_chat: true
  filter_overlong_prompts: true
  shuffle: true
  dataloader_num_workers: 8

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: models/math-distill-14b
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 64
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 3.0
    loss_agg_mode: seq-mean-token-sum-norm
    loss_scale_factor: 8192
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    ppo_epochs: 1
    shuffle: false
    optim:
      lr: 1e-6
      lr_scheduler_type: constant
      lr_warmup_steps: 0
      weight_decay: 0.01
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: async
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 8
    prompt_length: 2048
    response_length: 8192
    dtype: bfloat16
    gpu_memory_utilization: 0.6
    tensor_model_parallel_size: 2
    data_parallel_size: 1
    max_num_batched_tokens: 32768
    max_model_len: 18432
    enable_chunked_prefill: true
    enable_prefix_caching: true
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    val_kwargs:
      n: 4
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
    agent:
      num_workers: 16
      default_agent_loop: single_turn_agent

critic:
  enable: false

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  filter_groups:
    enable: true
    metric: reward
    max_num_gen_batches: 0
    max_inflight_gen_batches: 2
  rollout_correction:
    bypass_mode: false
    rollout_is: null
    rollout_rs: null

reward:
  num_workers: 16
  reward_manager:
    source: register
    name: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: false
  custom_reward_function:
    path: pkg://math_reasoning_rl.reward_scorer
    name: compute_score
    reward_kwargs:
      repetition_ngram_n: 4
      repetition_threshold: 0.3
      require_think_tags: true
      judge_base_url: http://judge-node:8001/v1
      judge_api_key: EMPTY
      judge_model: Qwen/Qwen3-235B-A22B
  reward_model:
    enable: false

trainer:
  use_v1: true
  nnodes: 2
  n_gpus_per_node: 8
  project_name: math_reasoning_rl_ref
  experiment_name: math_14b_dapo_16xh800
  logger: ["console", "wandb"]
  total_epochs: 10
  total_training_steps: 500
  test_freq: 50
  save_freq: 100
  val_before_train: true
  default_local_dir: checkpoints/math_reasoning_rl_ref/stage1_8k
  v1:
    trainer_mode: sync
    sampler:
      max_off_policy_threshold: null
      max_off_policy_strategy: drop
      sync_refill_failed_groups: false
      custom_sampler:
        path: pkg://math_reasoning_rl.overflow_replay_buffer
        name: OverflowReuseReplayBuffer
      sampler_kwargs:
        filter_groups_metric: reward
        train_batch_size: 128
        gen_batch_size: 1
        max_inflight_gen_batches: 2
        reuse_enabled: true
        max_reuse_steps: 1
        max_reuse_ratio: 0.5
        is_ratio_clip: 2.0

math_rl:
  reward_routing:
    repetition_ngram_n: 4
    repetition_threshold: 0.3
    require_think_tags: true
    judge_base_url: http://judge-node:8001/v1
    judge_api_key: EMPTY
    judge_model: Qwen/Qwen3-235B-A22B
    judge_timeout_s: 90.0
    judge_max_retries: 3
  entropy_band:
    enabled: true
    low: 0.45
    high: 0.65
    coef: 0.005
  pass_rate_weight:
    enabled: true
    center: 0.25
    sigma: 0.15
    amplitude: 0.6
    positive_reward_threshold: 0.0
  overflow_reuse:
    enabled: true
    max_reuse_steps: 1
    max_reuse_ratio: 0.5
    is_ratio_clip: 2.0
