# Stage 1 (8K context) DAPO configuration for 8xA800:
# - GPU 0-5: FSDP actor + colocated vLLM rollout (n_gpus_per_node: 6)
# - GPU 6-7: standalone vLLM judge serving Qwen/Qwen3-32B (TP=2) on port 8001

data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 8192
  train_batch_size: 64
  gen_batch_size: 1
  val_batch_size: 128
  return_raw_chat: true
  filter_overlong_prompts: true
  shuffle: true
  dataloader_num_workers: 4

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen3-8B
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 24
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 20480
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 3.0
    loss_agg_mode: seq-mean-token-sum-norm
    loss_scale_factor: 8192
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    ppo_epochs: 1
    shuffle: false
    optim:
      lr: 1e-6
      lr_scheduler_type: constant
      lr_warmup_steps: 0
      weight_decay: 0.01
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: async
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 8
    prompt_length: 2048
    response_length: 8192
    dtype: bfloat16
    gpu_memory_utilization: 0.55
    tensor_model_parallel_size: 2
    data_parallel_size: 1
    max_num_batched_tokens: 16384
    max_model_len: 10240
    enable_chunked_prefill: true
    enable_prefix_caching: true
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 24576
    val_kwargs:
      n: 4
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
    agent:
      num_workers: 6
      default_agent_loop: single_turn_agent

critic:
  enable: false

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  filter_groups:
    enable: true
    metric: reward
    max_num_gen_batches: 0
    max_inflight_gen_batches: 2
  rollout_correction:
    bypass_mode: false
    rollout_is: null
    rollout_rs: null

reward:
  num_workers: 8
  reward_manager:
    source: register
    name: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: false
  custom_reward_function:
    path: pkg://math_reasoning_rl.reward_scorer
    name: compute_score
    reward_kwargs:
      repetition_ngram_n: 4
      repetition_threshold: 0.3
      require_think_tags: true
      judge_base_url: http://127.0.0.1:8001/v1
      judge_api_key: EMPTY
      judge_model: Qwen/Qwen3-32B
  reward_model:
    enable: false

trainer:
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 6
  project_name: math_reasoning_rl
  experiment_name: qwen3_8b_dapo_stage1_8k
  logger: ["console"]
  total_epochs: 10
  total_training_steps: 500
  test_freq: 50
  save_freq: 100
  val_before_train: false
  default_local_dir: checkpoints/math_reasoning_rl/stage1_8k
  v1:
    trainer_mode: sync
    sampler:
      max_off_policy_threshold: null
      max_off_policy_strategy: drop
      sync_refill_failed_groups: false
      custom_sampler:
        path: pkg://math_reasoning_rl.overflow_replay_buffer
        name: OverflowReuseReplayBuffer
      sampler_kwargs:
        filter_groups_metric: reward
        train_batch_size: 64
        gen_batch_size: 1
        max_inflight_gen_batches: 2
        reuse_enabled: true
        max_reuse_steps: 1
        max_reuse_ratio: 0.5
        is_ratio_clip: 2.0

math_rl:
  reward_routing:
    repetition_ngram_n: 4
    repetition_threshold: 0.3
    require_think_tags: true
    judge_base_url: http://127.0.0.1:8001/v1
    judge_api_key: EMPTY
    judge_model: Qwen/Qwen3-32B
    judge_timeout_s: 60.0
    judge_max_retries: 3
  entropy_band:
    enabled: true
    low: 0.45
    high: 0.65
    coef: 0.005
  pass_rate_weight:
    enabled: true
    center: 0.25
    sigma: 0.15
    amplitude: 0.6
    positive_reward_threshold: 0.0
  overflow_reuse:
    enabled: true
    max_reuse_steps: 1
    max_reuse_ratio: 0.5
    is_ratio_clip: 2.0
