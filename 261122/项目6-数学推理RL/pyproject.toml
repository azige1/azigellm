[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math_reasoning_rl"
version = "0.1.0"
description = "Mathematical reasoning RLVR with routed rule/judge scoring, entropy band hinge regularization, pass-rate peak weighting, and single-step overflow reuse"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "sympy>=1.12",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "datasets>=2.18.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
train = [
    "verl==0.9.1",
    "ray>=2.35.0",
    "tensordict>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["math_reasoning_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
