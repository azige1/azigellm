[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "long-horizon-rl"
version = "0.1.0"
requires-python = ">=3.11"
description = "编码 Agent 长程 RL 训练框架：两阶段课程学习、篡改检测、上下文压缩分段与 GiGPO step 级信用分配"
readme = "README.md"
dependencies = [
    "verl==0.9.1",
    "torch>=2.6.0",
    "transformers>=4.51.0",
    "ray>=2.40.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "tensordict>=0.6.0",
    "datasets>=2.18.0",
    "docker>=7.0.0",
    "gitpython>=3.1.43",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
]
vllm = [
    "vllm>=0.8.0",
]

[project.scripts]
lhrl-train = "long_horizon_rl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["long_horizon_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
