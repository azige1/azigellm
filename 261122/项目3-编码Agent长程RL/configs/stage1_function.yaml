hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: data/stage1_train.parquet
  val_files: data/stage1_eval.parquet
  prompt_key: prompt
  max_prompt_length: 4096
  max_response_length: 28672
  train_batch_size: 16
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: checkpoints/project2-qwen3-8b-sft
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.0
      weight_decay: 0.01
    ppo_mini_batch_size: 16
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    checkpoint:
      save_contents:
        - model
        - optimizer
        - extra
        - hf_model
  rollout:
    name: vllm
    mode: async
    n: 8
    temperature: 0.8
    top_p: 0.95
    top_k: -1
    prompt_length: 4096
    response_length: 28672
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.55
    max_model_len: 32768
    calculate_log_probs: true
    multi_turn:
      enable: true
      max_assistant_turns: 8
      max_parallel_calls: 4
      max_tool_response_length: 4096
      tool_response_truncate_side: middle
      format: hermes
      tokenization_sanity_check_mode: ignore_strippable
    agent:
      num_workers: 8
      default_agent_loop: coding_compaction_agent
      agent_loop_config_path: configs/agent_loop.yaml

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: false

trainer:
  project_name: project3-long-horizon-rl
  experiment_name: qwen3-8b-stage1-function
  logger:
    - console
  nnodes: 1
  n_gpus_per_node: 8
  use_v1: true
  v1:
    trainer_mode: sync
  total_epochs: 10
  total_training_steps: 120
  save_freq: 30
  test_freq: 30
  val_before_train: true
  default_local_dir: checkpoints/stage1_function
  rollout_data_dir: logs/rollout_stage1

coding_rl:
  curriculum:
    stage: function
    pass_at_8_min: 1
    pass_at_8_max: 6
    prune_interval_steps: 30
    stage1_max_turns: 8
    stage2_max_turns: 60
  reward:
    mode: pass_ratio
    enable_tamper_scan: true
    tamper_log_path: logs/tamper_stage1.jsonl
    audit_interval_steps: 30
    audit_top_k: 50
    test_timeout_s: 300
    scoring_backend: local
  compaction:
    enable: true
    window_tokens: 32768
    compact_threshold_tokens: 27000
    summary_max_tokens: 4096
    keep_recent_turns: 4
    max_segments: 4
    normalize_by_trajectory_tokens: true
  step_advantage:
    enable: true
    gamma: 0.95
    omega: 0.5
    granularity: full
    min_group_size: 2
    group_by_uid: false
  sandbox:
    enable: false
    pool_size_per_task: 10
    tool_timeout_s: 300
    use_docker: false
