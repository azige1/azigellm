hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: data/processed/train.parquet
  val_files: data/processed/val.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 512
  max_response_length: 1024
  train_batch_size: 32
  val_batch_size: 100
  dataloader_num_workers: 4
  shuffle: true
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:POLICY_SFT_MODEL_PATH,"Qwen/Qwen3-8B"}
    use_remove_padding: true
    enable_gradient_checkpointing: true
    lora_rank: 64
    lora_alpha: 128
    target_modules: all-linear
    lora:
      rank: 64
      alpha: 128
      merge: false
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: false
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.0
    loss_agg_mode: token-mean
    optim:
      lr: 1e-5
      lr_scheduler_type: constant
      lr_warmup_steps_ratio: 0.0
      lr_warmup_steps: 0
      weight_decay: 0.01
      clip_grad: 1.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: async
    n: 8
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.55
    max_model_len: 2048
    max_num_batched_tokens: 8192
    log_prob_micro_batch_size_per_gpu: 8
    calculate_log_probs: true
    val_kwargs:
      temperature: 0.7
      top_p: 0.95
      top_k: -1
      n: 1
      do_sample: true
    agent:
      num_workers: 6
      default_agent_loop: single_turn_agent
  ref:
    log_prob_micro_batch_size_per_gpu: 8

critic:
  enable: false

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: false

reward:
  num_workers: 8
  custom_reward_function:
    path: pkg://translation_grpo.reward_scoring
    name: compute_score
  reward_manager:
    source: register
    name: naive
  reward_model:
    enable: false

trainer:
  project_name: translation_grpo
  experiment_name: qwen3_8b_grpo_8xa800
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 6
  total_epochs: 10
  total_training_steps: 200
  save_freq: 20
  test_freq: 20
  val_before_train: true
  default_local_dir: checkpoints/translation_grpo/qwen3_8b_grpo_8xa800
  use_v1: true
  v1:
    trainer_mode: sync

transfer_queue:
  enable: true
