# Configuration for 5.1 judge calibration and 5.5 external strong-model checkpoint selection.
online_judge:
  base_url: "http://127.0.0.1:8000/v1"
  api_key_env: "JUDGE_API_KEY"
  model: "Qwen3-32B"
  timeout_s: 60.0
  max_retries: 4
  max_concurrency: 32
  temperature: 0.0
  cache_path: "outputs/judge_eval_cache/online_judge_cache.jsonl"

external_strong_judge:
  # OpenAI-compatible endpoint; supply credentials via STRONG_JUDGE_API_KEY env var.
  base_url: "https://api.openai.com/v1"
  api_key_env: "STRONG_JUDGE_API_KEY"
  model: "gpt-5"
  timeout_s: 90.0
  max_retries: 4
  max_concurrency: 16
  temperature: 0.0
  cache_path: "outputs/judge_eval_cache/strong_judge_cache.jsonl"

protocol:
  pairwise_diff_threshold: 2.0
  eval_decoding_temperature: 0.7
  overopt_consecutive_divergences: 2
  save_freq: 20
