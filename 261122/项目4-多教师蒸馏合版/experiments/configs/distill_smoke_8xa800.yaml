defaults:
  - distill_8xa800
  - _self_

data:
  train_batch_size: 8
  gen_batch_size: 8
  val_batch_size: 8
  max_prompt_length: 8192
  max_response_length: 2048
  train_max_samples: 64
  val_max_samples: 16

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 4096
    optim:
      lr_warmup_steps: 1
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      offload_policy: true
  rollout:
    prompt_length: 8192
    response_length: 2048
    max_model_len: 10240
    log_prob_max_token_len_per_gpu: 4096
    agent:
      num_workers: 2

trainer:
  total_training_steps: 2
  save_freq: 1
  test_freq: 1
  experiment_name: mopd-qwen3-8b-smoke
